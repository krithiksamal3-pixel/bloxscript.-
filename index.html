!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Script Pad</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:#0b0d12; color:#fff; display:flex; justify-content:center;
  padding:32px 16px;
}
.app{width:min(900px,100%)}
h1{margin:0 0 8px;font-size:32px}
p{color:#9da4b2;margin:0 0 22px}
.card{
  background:#141821;border:1px solid #272d39;border-radius:18px;
  padding:18px;box-shadow:0 15px 45px #0008;
}
textarea{
  width:100%;height:360px;resize:vertical;border:1px solid #303746;
  border-radius:12px;background:#090b10;color:#d9e0ea;padding:16px;
  font:14px/1.55 Consolas,monospace;outline:none;
}
textarea:focus{border-color:#7280ff}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{
  border:0;border-radius:10px;padding:11px 16px;cursor:pointer;
  background:#6572ff;color:white;font-weight:700;
}
button.secondary{background:#252b36}
.status{margin-top:12px;color:#8f98a8;font-size:13px}
.note{
  margin-top:18px;padding:12px;border-radius:10px;background:#10131a;
  color:#9da4b2;font-size:13px;
}
</style>
</head>
<body>
<main class="app">
  <h1>⚡ Blox Script Pad</h1>
  <p>Paste your Lua script below. This page only stores/displays the text — it does not execute Roblox code.</p>

  <section class="card">
    <textarea id="code" spellcheck="false" placeholder="Paste your Lua script here..."></textarea>
    <div class="buttons">
      <button onclick="copyCode()">Copy Script</button>
      <button class="secondary" onclick="saveCode()">Save .lua</button>
      <button class="secondary" onclick="clearCode()">Clear</button>
    </div>
    <div class="status" id="status">Ready.</div>
    <div class="note">
      Tip: Don't paste passwords, private keys, cookies, or other sensitive information into a public website.
    </div>
  </section>
</main>

<script>
const box = document.getElementById("code");
const status = document.getElementById("status");

function copyCode(){
  navigator.clipboard.writeText(box.value).then(()=>{
    status.textContent = "Copied!";
  }).catch(()=>{
    status.textContent = "Copy failed — select the text and copy it manually.";
  });
}

function saveCode(){
  const blob = new Blob([box.value], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "script.lua";
  a.click();
  URL.revokeObjectURL(a.href);
  status.textContent = "Saved as script.lua";
}

function clearCode(){
  box.value = "";
  status.textContent = "Cleared.";
}
</script>
</body>
</html>
